name: App Store Durum
on: workflow_dispatch
permissions:
  contents: write
jobs:
  status:
    runs-on: ubuntu-latest
    env:
      KID: ${{ secrets.ASC_KEY_ID }}
      ISS: ${{ secrets.ASC_ISSUER_ID }}
      P8: ${{ secrets.ASC_KEY_P8 }}
      APP_ID: com.serhattutak.mirasfc
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyjwt cryptography && python3 tools/asc_status.py
