# App Store'a herkese açık güncelleme gönderimi (Apple incelemesine).
# - TestFlight'a zaten yüklenmiş build'i kullanır (yeniden derlemez).
# - Yalnızca elle tetiklenir (workflow_dispatch). Push'ta ÇALIŞMAZ.
# - ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 gizli anahtarlarını kullanır.
name: App Store Submit
on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Sürüm (MARKETING_VERSION)"
        required: true
        default: "4.3"
permissions:
  contents: write
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KID: ${{ secrets.ASC_KEY_ID }}
      ISS: ${{ secrets.ASC_ISSUER_ID }}
      P8: ${{ secrets.ASC_KEY_P8 }}
      APP_ID: com.serhattutak.mirasfc
      VER: ${{ github.event.inputs.app_version }}
      AUTO_RELEASE: "1"
      TR_NOTES: |
        Yenilikler (4.3):
        • Yeni kontroller: oku çekmek = pas/şut, ekrana dokunmak = top sürme
        • Daha akıcı ve gerçekçi top sürme
        • Gerçekçi kaleci: açıyı kapatır, yeri geldiğinde öne çıkar, daha iyi kurtarır
        • Rakip savunma artık topun peşinden koşuyor ve geri kurtarıyor
        • Çeşitli iyileştirmeler ve hata düzeltmeleri
      EN_NOTES: |
        What's New (4.3):
        • New controls: pull to pass/shoot, tap to dribble
        • Smoother, more realistic dribbling
        • Realistic goalkeeper: cuts the angle, comes off the line, better saves
        • Opponent defenders now chase the ball and track back
        • Various improvements and bug fixes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bağımlılıklar
        run: pip install --quiet pyjwt cryptography
      - name: App Store'a gönder
        run: |
          set -o pipefail
          python3 tools/asc_submit.py 2>&1 | tee "$RUNNER_TEMP/asc.log"
      - name: Günlüğü yayınla (gizli bilgiler silinmiş)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="$RUNNER_TEMP/asc.log"; [ -f "$f" ] || { echo "günlük yok"; exit 0; }
          KID2=$(printf '%s' "$KID" | LC_ALL=C tr -cd 'A-Za-z0-9')
          ISS2=$(printf '%s' "$ISS" | LC_ALL=C tr -cd 'A-Za-z0-9-')
          sed -i -e "s/$KID2/[KEYID]/g" -e "s/$ISS2/[ISSUER]/g" -e '/PRIVATE KEY/d' "$f" || true
          cp "$f" appstore-log.txt
          gh release view ci-logs >/dev/null 2>&1 || gh release create ci-logs --prerelease --title "CI günlükleri" --notes "Günlükler"
          gh release upload ci-logs appstore-log.txt --clobber
          echo "Günlük: ci-logs/appstore-log.txt"
